name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test (Windows)
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: NSGo Check
        run: go tool nsgo check

      - name: NSGo Test
        run: go tool nsgo test ./...

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          go tool nsgo build -target windows_x64 -version $version -ldflags "-X nsgook/internal/app.AppVersion=$version"
          $setup = "dist/releases/nsgook-$version-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) {
            throw "installer not built: $setup"
          }
          if (-not (Test-Path "$setup.sha256")) {
            throw "installer checksum not written: $setup.sha256"
          }
          Get-ChildItem dist/releases | Format-Table Name, Length

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/releases/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          version: v2.14.2
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "NSGook $TAG" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "$TAG" --title "NSGook $TAG" --notes-file release-notes.md "${flags[@]}" release-assets/*
          fi

  changelog:
    name: Update CHANGELOG.md
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          version: v2.14.2
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit changelog
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- CHANGELOG.md)" ]; then
            echo "CHANGELOG.md is already current"
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "docs: update changelog for $TAG"
          git pull --rebase origin main
          git push origin HEAD:main
